<body>

<button id="fs" title="Fullscreen">&#x26F6;</button>

<script>
'use strict';

// ============================================================
//  PONY QUEST: The Secret of the M25
//  A LucasArts-style (SCUMM 9-verb) remake of the M25 incident.
//  320x200, VGA-dithered backgrounds, speech above heads.
// ============================================================

const W = 320, H = 200;
const SCENE_H = 144;          // playfield height
const SENT_Y = 146;           // sentence line baseline area
const UI_Y = 156;             // verb grid / inventory top
const WALK_SPEED = 1.1;

// ===== CANVAS =====
const display = document.getElementById('c');
const dctx = display.getContext('2d');
const buf = document.createElement('canvas');
buf.width = W; buf.height = H;
const fctx = buf.getContext('2d');
const bg = document.createElement('canvas');
bg.width = W; bg.height = SCENE_H;
const bgctx = bg.getContext('2d');

let cx_ = fctx; // current draw target (swapped to bgctx for prerender)

function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const dpr = window.devicePixelRatio || 1;
  const f = Math.min(vw * dpr / W, vh * dpr / H);   // exact fit, in device px
  const s = Math.max(1, Math.floor(f));             // integer render scale
  display.width = W * s; display.height = H * s;
  if (dpr >= 2 || f < 1) {
    // hi-dpi (phones): stretch to exact fit — off-by-a-hair pixels are
    // invisible at this density, and filling the screen matters more
    display.style.width  = Math.floor(W * f / dpr) + 'px';
    display.style.height = Math.floor(H * f / dpr) + 'px';
  } else {
    // desktop: pure integer scaling, perfectly uniform pixels
    display.style.width  = (W * s / dpr) + 'px';
    display.style.height = (H * s / dpr) + 'px';
  }
  dctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 100));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
document.addEventListener('fullscreenchange', resize);
resize();

// ===== DRAW HELPERS =====
function R(x,y,w,h,c) { cx_.fillStyle=c; cx_.fillRect(x,y,w,h); }
// banded gradient with dithered seams — the VGA sky look
function DGRAD(x,y,w,h,cols) {
  const n=cols.length, bh=h/n;
  for(let i=0;i<n;i++) R(x, Math.floor(y+i*bh), w, Math.ceil(bh)+1, cols[i]);
  for(let i=1;i<n;i++) {
    const by=Math.floor(y+i*bh);
    cx_.fillStyle=cols[i-1];
    for(let r=0;r<2;r++) {
      const yy=by+r;
      if(yy>=y+h) break;
      for(let xx=x+((yy+r)&1); xx<x+w; xx+=2) cx_.fillRect(xx,yy,1,1);
    }
  }
}
// pixel line (no antialiasing, unlike ctx.stroke)
function PLINE(x0,y0,x1,y1,c,w) {
  w=w||1;
  const dx=x1-x0, dy=y1-y0, n=Math.max(Math.abs(dx),Math.abs(dy),1);
  cx_.fillStyle=c;
  for(let i=0;i<=n;i++)
    cx_.fillRect(Math.round(x0+dx*i/n), Math.round(y0+dy*i/n), w, w);
}
// filled pixel circle
function PDISC(cx,cy,r,c) {
  cx_.fillStyle=c;
  for(let y=-r;y<=r;y++){
    const hw=Math.floor(Math.sqrt(r*r-y*y)+0.5);
    cx_.fillRect(Math.round(cx-hw),Math.round(cy+y),hw*2+1,1);
  }
}

// ===== BITMAP FONT (5x7, crisp at any integer scale) =====
const FONT5={
A:'0E11111F111111',B:'1E11111E11111E',C:'0E11101010110E',D:'1E11111111111E',
E:'1F10101E10101F',F:'1F10101E101010',G:'0E11101711110F',H:'1111111F111111',
I:'0E04040404040E',J:'0702020202120C',K:'11121418141211',L:'1010101010101F',
M:'111B1515111111',N:'11191513111111',O:'0E11111111110E',P:'1E11111E101010',
Q:'0E11111115120D',R:'1E11111E141211',S:'0F10100E01011E',T:'1F040404040404',
U:'1111111111110E',V:'11111111110A04',W:'1111111515150A',X:'11110A040A1111',
Y:'11110A04040404',Z:'1F01020408101F',
a:'00000E010F110F',b:'10101E1111111E',c:'00000F1010100F',d:'01010F1111110F',
e:'00000E111F100E',f:'06081C08080808',g:'00000F110F010E',h:'10101E11111111',
i:'04000C0404040E',j:'0200060202120C',k:'10101214181412',l:'0C04040404040E',
m:'00001A15151515',n:'00001E11111111',o:'00000E1111110E',p:'00001E111E1010',
q:'00000F110F0101',r:'00001619101010',s:'00000F100E011E',t:'08081C08080906',
u:'0000111111130D',v:'00001111110A04',w:'0000111115150A',x:'0000110A040A11',
y:'000011110F010E',z:'00001F0204081F',
'0':'0E13151519110E','1':'040C040404040E','2':'0E11010608101F','3':'1F02040201110E',
'4':'02060A121F0202','5':'1F101E0101110E','6':'0608101E11110E','7':'1F010204080808',
'8':'0E11110E11110E','9':'0E11110F01020C',
'.':'000000000C0C00',',':'000000000C0408','!':'04040404040004','?':'0E110102040004',
"'":'04040800000000','"':'0A0A0A00000000',':':'000C0C000C0C00',';':'000C0C000C0408',
'-':'0000000E000000','(':'02040808080402',')':'08040202020408','*':'0004150E150400',
'/':'01010204081010','&':'0C12140815120D','+':'0004041F040400',
};
const GLYPH={};
for(const k in FONT5){ const s=FONT5[k],r=[]; for(let i=0;i<7;i++) r.push(parseInt(s.substr(i*2,2),16)||0); GLYPH[k]=r; }
function normTxt(t){ return String(t).replace(/—/g,'-').replace(/…/g,'...').replace(/[‘’]/g,"'").replace(/[“”]/g,'"'); }
function textW(t,s){ s=s||1; return normTxt(t).length*6*s-s; }
// y = TOP of glyphs. align: 'left'|'center'|'right'
function TXT(t,x,y,c,align,s) {
  s=s||1; t=normTxt(t);
  if(align==='center') x-=textW(t,s)/2;
  else if(align==='right') x-=textW(t,s);
  x=Math.round(x); y=Math.round(y);
  cx_.fillStyle=c;
  for(const ch of t) {
    const g=GLYPH[ch];
    if(g) for(let r=0;r<7;r++){ const v=g[r]; if(!v) continue;
      for(let col=0;col<5;col++) if(v&(16>>col)) cx_.fillRect(x+col*s,y+r*s,s,s);
    }
    x+=6*s;
  }
}
// outlined text, LucasArts speech style (8-direction outline)
function OTXT(t,x,y,c,align,s) {
  for(let ox=-1;ox<=1;ox++) for(let oy=-1;oy<=1;oy++)
    if(ox||oy) TXT(t,x+ox,y+oy,'#000',align,s);
  TXT(t,x,y,c,align,s);
}
// 3x5 micro font for in-world signage (signs, posters, car livery)
const FONT3={
A:'25755',C:'34443',D:'65556',E:'74647',H:'55755',I:'72227',L:'44447',M:'57555',
N:'65555',O:'75557',P:'65644',R:'65655',S:'34216',T:'72222',U:'55557',V:'55552',
X:'55255',Y:'55222','2':'61247','5':'74616',' ':'00000',
};
function TXT3(t,x,y,c) {
  cx_.fillStyle=c; x=Math.round(x); y=Math.round(y);
  for(const ch of t) {
    const g=FONT3[ch];
    if(g) for(let r=0;r<5;r++){ const v=parseInt(g[r],16);
      for(let col=0;col<3;col++) if(v&(4>>col)) cx_.fillRect(x+col,y+r,1,1);
    }
    x+=4;
  }
}
function wrapText(t, max) {
  t=normTxt(t);
  const words=t.split(' '), lines=[];
  let cur='';
  for(const w of words) {
    if((cur+' '+w).trim().length>max) { lines.push(cur.trim()); cur=w; }
    else cur+=' '+w;
  }
  if(cur.trim()) lines.push(cur.trim());
  return lines;
}

// ===== GAME STATE =====
const G = {
  screen: 'title',
  scene: 1,
  inventory: [],
  flags: {},
  player: { x:160, y:134, tx:160, ty:134, frame:0, walking:false, action:null, visible:true },
  pony: { x:200, y:92, tx:200, ty:92, frame:0, timer:0, state:'trot' },
  sayQ: [],            // queue of {actor,text,cb}
  sayCur: null,        // {actor,lines,timer,cb}
  dialog: null,        // {choices:[{label,val}],hover,cb}
  walkCB: null,
  transition: 0,
  nextScene: 0,
  tick: 0,
  journChoices: [],
  hoverHot: null, hoverVerb: -1, hoverInv: -1, hoverChoice: -1,
};

// sentence-line state: selected verb + optional first (inventory) object
const cur = { verb:null, item:null };
function resetCur(){ cur.verb=null; cur.item=null; }

// ===== VERBS (Monkey Island 9-verb grid) =====
const VERBS = [
  {id:'give',   label:'Give'},   {id:'pickup', label:'Pick up'}, {id:'use',  label:'Use'},
  {id:'open',   label:'Open'},   {id:'lookat', label:'Look at'}, {id:'push', label:'Push'},
  {id:'close',  label:'Close'},  {id:'talkto', label:'Talk to'}, {id:'pull', label:'Pull'},
];
const VLABEL = {}; for(const v of VERBS) VLABEL[v.id]=v.label;
const DEFAULTS = {
  give:   "I'd need to be holding something first.",
  pickup: "That's staying exactly where it is.",
  use:    "I can think of no policing application for that.",
  open:   "It doesn't open. And I've had training in these matters.",
  close:  "It's about as closed as it's ever going to be.",
  push:   "I push. It declines.",
  pull:   "Pulling achieves nothing. A theme is developing this morning.",
  talkto: "I talk to enough inanimate objects at the Monday briefing.",
  lookat: "It's exactly as interesting as it looks.",
};

// ===== INPUT =====
let mx=0, my=0, clicked=false, rclicked=false;
const TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
function toGame(cx, cy) {
  const r = display.getBoundingClientRect();
  mx = Math.max(0, Math.min(W-1, Math.floor((cx - r.left) / (r.width / W))));
  my = Math.max(0, Math.min(H-1, Math.floor((cy - r.top) / (r.height / H))));
}
display.addEventListener('mousemove', e => toGame(e.clientX, e.clientY));
display.addEventListener('click', () => { clicked=true; });
display.addEventListener('contextmenu', e => { e.preventDefault(); rclicked=true; });

// --- touch: tap = click, double-tap or long-press = default action ---
let lastTap={t:0,x:0,y:0}, touchCur=null, lpTimer=null;
display.addEventListener('touchstart', e => {
  e.preventDefault();
  const t=e.changedTouches[0];
  toGame(t.clientX, t.clientY);
  touchCur={x:mx, y:my, moved:false};
  clearTimeout(lpTimer);
  lpTimer=setTimeout(() => {
    if(touchCur && !touchCur.moved) { rclicked=true; touchCur=null; }
  }, 450);
}, {passive:false});
display.addEventListener('touchmove', e => {
  e.preventDefault();
  const t=e.changedTouches[0];
  toGame(t.clientX, t.clientY);
  if(touchCur && (Math.abs(mx-touchCur.x)>4 || Math.abs(my-touchCur.y)>4)) touchCur.moved=true;
}, {passive:false});
display.addEventListener('touchend', e => {
  e.preventDefault();
  clearTimeout(lpTimer);
  // first tap on the title screen doubles as the fullscreen gesture (Android)
  if(G.screen==='title' && document.fullscreenEnabled && !document.fullscreenElement)
    document.documentElement.requestFullscreen({navigationUI:'hide'}).catch(()=>{});
  if(!touchCur) return;                     // long-press already fired
  if(!touchCur.moved) {
    const now=performance.now();
    if(now-lastTap.t<350 && Math.abs(mx-lastTap.x)<24 && Math.abs(my-lastTap.y)<24) {
      rclicked=true; lastTap.t=0;           // double-tap -> default verb
    } else {
      clicked=true; lastTap={t:now, x:mx, y:my};
    }
  }
  touchCur=null;
}, {passive:false});
display.addEventListener('touchcancel', () => { clearTimeout(lpTimer); touchCur=null; });

// --- fullscreen toggle button (hidden where unsupported, e.g. iOS Safari) ---
const fsBtn=document.getElementById('fs');
if(document.fullscreenEnabled) {
  fsBtn.style.display='block';
  const fsToggle=e => {
    e.preventDefault(); e.stopPropagation();
    if(document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen({navigationUI:'hide'}).catch(()=>{});
  };
  fsBtn.addEventListener('click', fsToggle);
  fsBtn.addEventListener('touchend', fsToggle, {passive:false});
}

// ===== SPEECH (text above heads, LucasArts style) =====
const VOICE = {
  paul:   '#ffffff',
  pony:   '#d8a838',
  journ:  '#ff88cc',
  phone:  '#ffff55',
  radio:  '#ffff55',
  cop:    '#88ddff',
  narr:   '#55ffff',
};
function say(actor, text, cb) { G.sayQ.push({actor,text,cb:cb||null}); }
function sayP(text, cb) { say('paul', text, cb); }
function advanceSay() {
  const c = G.sayCur;
  G.sayCur = null;
  if(c && c.cb) c.cb();
}
function updateSay() {
  if(!G.sayCur && G.sayQ.length) {
    const n = G.sayQ.shift();
    G.sayCur = { actor:n.actor, lines:wrapText(n.text, 30), timer:Math.max(110, n.text.length*3.2), cb:n.cb };
  }
  if(G.sayCur) {
    G.sayCur.timer--;
    if(G.sayCur.timer<=0) advanceSay();
  }
}
function sayBusy(){ return G.sayCur!==null || G.sayQ.length>0; }
function actorAnchor(actor) {
  switch(actor) {
    case 'paul':  return {x:G.player.x, y:G.player.y-38};
    case 'pony':  return {x:G.pony.x,   y:G.pony.y-26};
    case 'journ': return {x:210, y:124-40};
    case 'phone': return {x:36,  y:78};
    case 'radio': return {x:60,  y:78};
    case 'cop':   return {x:G.scene===2?115:40, y:G.scene===2?100:64};
    case 'narr':  return {x:160, y:14};
  }
  return {x:160,y:14};
}
function drawSay() {
  const s=G.sayCur;
  if(!s) return;
  const a=actorAnchor(s.actor);
  let wmax=0;
  for(const l of s.lines) wmax=Math.max(wmax, textW(l));
  let sx=Math.max(wmax/2+3, Math.min(W-wmax/2-3, a.x));
  let sy=a.y - (s.lines.length-1)*9 - 7;
  sy=Math.max(3, sy);
  for(let i=0;i<s.lines.length;i++)
    OTXT(s.lines[i], sx, sy+i*9, VOICE[s.actor]||'#fff', 'center');
}

// ===== DIALOG CHOICES (bottom panel, MI style) =====
function showChoices(choices, cb) { G.dialog={choices, hover:-1, cb}; }

// ===== INVENTORY =====
function addItem(id,name,desc){ if(!G.inventory.find(i=>i.id===id)) G.inventory.push({id,name,desc}); }
function hasItem(id){ return G.inventory.some(i=>i.id===id); }
function removeItem(id){ G.inventory=G.inventory.filter(i=>i.id!==id); }

function drawItemIcon(id,x,y) {
  switch(id) {
    case 'rope':
      PDISC(x+5,y+6,4,'#a08040');
      PDISC(x+5,y+6,2,'#000');
      R(x+3,y+3,2,1,'#c0a060'); R(x+8,y+8,2,2,'#806030');
      break;
    case 'apple':
      R(x+3,y+4,6,5,'#c81c1c'); R(x+4,y+3,4,7,'#c81c1c');
      R(x+4,y+4,2,2,'#f06048'); R(x+5,y+1,1,3,'#5a3a1a'); R(x+6,y+2,2,1,'#2a8828');
      break;
    case 'auth':
      R(x+2,y+1,8,10,'#e8e8e0'); R(x+9,y+1,1,10,'#b8b8b0');
      R(x+3,y+3,5,1,'#666'); R(x+3,y+5,6,1,'#666'); R(x+3,y+7,4,1,'#666');
      R(x+7,y+8,2,2,'#b02020');
      break;
  }
}

// ===== SPRITES =====
function drawPaul(px,py,frame,walking,action,talking) {
  px=Math.floor(px); py=Math.floor(py);
  const f=Math.floor(frame)%4;
  const bob = walking && (f===1||f===3) ? 1 : 0;
  const x=px-7, y=py-36+bob;
  // soft shadow
  cx_.fillStyle='rgba(0,0,0,0.3)'; cx_.fillRect(x,py-1,15,2); cx_.fillRect(x+2,py+1,11,1);
  let ll=0, rl=0, al=0, ar=0;
  if(walking){ if(f===0){ll=-2;rl=2;al=2;ar=-2;} else if(f===2){ll=2;rl=-2;al=-2;ar=2;} }
  // ---- legs: dark trousers with crease highlight ----
  R(x+3+ll, y+27, 4, 8, '#1e2946'); R(x+4+ll, y+27, 1, 8, '#2a3a5e');
  R(x+8+rl, y+27, 4, 8, '#1e2946'); R(x+9+rl, y+27, 1, 8, '#2a3a5e');
  // shoes
  R(x+3+ll, y+34, 5, 2, '#0a0a0a'); R(x+3+ll, y+34, 4, 1, '#222');
  R(x+8+rl, y+34, 5, 2, '#0a0a0a'); R(x+8+rl, y+34, 4, 1, '#222');
  // ---- torso: crisp white shirt, shaded right side ----
  R(x+2, y+13, 11, 12, '#f0f0f6');
  R(x+11, y+13, 2, 12, '#c8c8d8');           // shade
  R(x+2, y+13, 1, 12, '#fbfbff');            // light edge
  // epaulettes
  R(x+2, y+13, 3, 2, '#1e2946'); R(x+10, y+13, 3, 2, '#1e2946');
  R(x+3, y+13, 1, 1, '#8a94b0'); R(x+11, y+13, 1, 1, '#8a94b0');
  // collar + black tie
  R(x+6, y+12, 3, 1, '#fbfbff');
  R(x+6, y+13, 3, 2, '#14181f');             // knot
  R(x+7, y+15, 2, 6, '#14181f');
  R(x+6, y+20, 2, 2, '#14181f');             // tie tip swing
  // chest radio (clipped, very 2003)
  R(x+3, y+16, 3, 4, '#181820'); R(x+3, y+16, 3, 1, '#33333f'); R(x+4, y+15, 1, 1, '#555');
  // pocket line
  R(x+9, y+17, 3, 1, '#c8c8d8');
  // ---- duty belt with pouches ----
  R(x+2, y+25, 11, 2, '#0e1219');
  R(x+6, y+25, 2, 2, '#9aa0ae');             // buckle
  R(x+2, y+25, 2, 3, '#1a1f2a');             // pouch L
  R(x+11, y+25, 2, 3, '#1a1f2a');            // pouch R
  // ---- arms ----
  if(action==='phone') {
    R(x-1, y+14, 3, 6, '#e8e8f0'); R(x, y+10, 3, 4, '#e0b088');   // hand to ear
    R(x+1, y+9, 2, 3, '#181820');                                  // the phone
    R(x+12, y+15+ar, 3, 8, '#e8e8f0'); R(x+12, y+22+ar, 3, 2, '#e0b088');
  } else if(action==='calm') {
    R(x+12, y+15, 6, 3, '#e8e8f0'); R(x+17, y+15, 3, 3, '#e0b088'); // arm out
    R(x-1, y+15, 3, 8, '#e8e8f0'); R(x-1, y+22, 3, 2, '#e0b088');
  } else {
    R(x-1, y+14+al, 3, 9, '#e8e8f0'); R(x-2, y+14+al, 1, 8, '#c8c8d8');
    R(x-1, y+22+al, 3, 2, '#e0b088');
    R(x+12, y+14+ar, 3, 9, '#d8d8e4'); R(x+14, y+14+ar, 1, 8, '#b8b8c8');
    R(x+12, y+22+ar, 3, 2, '#d0a078');
  }
  // ---- head ----
  R(x+3, y+5, 9, 8, '#e0b088');
  R(x+10, y+5, 2, 8, '#c09068');             // face shade
  R(x+2, y+7, 1, 3, '#e0b088'); R(x+12, y+7, 1, 3, '#c09068'); // ears
  R(x+2, y+5, 1, 2, '#6a4a2a'); R(x+12, y+5, 1, 2, '#5a3c20'); // sideburns
  // eyes with whites (blink)
  if(G.tick%140>8) {
    R(x+4,y+7,2,1,'#fff'); R(x+8,y+7,2,1,'#fff');

// 50% checkerboard dither overlay
function DITH(x,y,w,h,c,par) {
  cx_.fillStyle=c;
  for(let yy=y;yy<y+h;yy++)
    for(let xx=x+((yy+(par||0))&1);xx<x+w;xx+=2)
      cx_.fillRect(xx,yy,1,1);
}
// deterministic speckle
function SPECK(x,y,w,h,c,mod,lim) {
  cx_.fillStyle=c;
  for(let xx=x;xx<x+w;xx++)
    for(let yy=y;yy<y+h;yy++)
      if((xx*7+yy*13)%mod<lim) cx_.fillRect(xx,yy,1,1);
}

function answerPhone() {
  if(G.flags.phoneAnswered) return sayP("I've already taken the call. One pony per phone call, that's the rule.");
  G.flags.phoneAnswered=true; G.flags.phoneRinging=false;
  G.player.action='phone';
  say('phone',"Dispatch to Anthem. We've got a report of a Shetland pony loose on the M25 southbound, between junctions 15 and 16.");
  say('phone',"It's heading NORTH. Against traffic. We need that carriageway closed immediately.");
  say('paul',"...A Shetland pony. On the M25. At half past six in the morning.");
  say('phone',"That's confirmed, Paul. Small horse. Big road. Wrong direction.");
  say('paul',"Thank you, dispatch. Very complete picture.", ()=>{
    G.player.action=null;
    sayP("Right. Better get this sorted before rush hour turns it into a western.");
  });
}
function useRadio() {
  if(!G.flags.phoneAnswered) return sayP("I should probably answer that phone first. It sounds urgent. Phones always do.");
  if(G.flags.closureAuth) return sayP("The closure's already authorized. Once is policy, twice is showing off.");
  G.flags.closureAuth=true;
  addItem('auth','authorization','Road closure authorization, M25 J15-J16. Laminated? No. Powerful? Immensely.');
  say('paul',"All units, this is Paul Anthem, Thames Valley Police. Authorize immediate closure of the M25 southbound, junctions 15 to 16. We have a loose animal on the carriageway.");
  say('radio',"Copy that, Paul. Units en route. Carriageway closed at 06:50.", ()=>{
    sayP("06:50. The M25, shut by a pony. There's a sentence I never trained for.");
  });
}
function tryLeave() {
  if(!G.flags.phoneAnswered) return sayP("The phone is ringing itself off the desk. Leaving now would be the second-worst decision made on the M25 this morning.");
  if(!G.flags.closureAuth)  return sayP("I can't have a pony playing chicken with live traffic. I need to radio in the road closure first.");
  if(!hasItem('rope'))      return sayP("Catch a pony with my bare hands and good intentions? No. There's a perfectly good rope on that coat rack.");
  if(!hasItem('apple'))     return sayP("I'll need the pony to come to ME. Nothing on this earth moves a Shetland except food and spite, and I can't weaponise spite before seven.");
  sayP("Phone answered, road shut, rope, apple. That's the full pony-retrieval loadout. Let's go.", ()=>{
    say('narr',"06:55 AM — The M25, between junctions 15 and 16.", ()=>changeScene(2));
  });
}

function giveApple() {
  if(!hasItem('apple')) return sayP("I'm fresh out of apples.");
  if(G.pony.state!=='trot') return sayP("The apple's already done its job.");
  removeItem('apple'); G.flags.appleGone=true;
  const ax=Math.max(110,Math.min(290,G.player.x+20)), ay=Math.max(98,Math.min(120,G.player.y-6));
  G.flags.applePlaced=true; G.flags.appleX=ax; G.flags.appleY=ay;
  sayP("Here you go, boy. Fresh from the Thames Valley Police fruit bowl.", ()=>{
    say('pony',"*interested snort*", ()=>{
      G.pony.state='approach';
      G.pony.tx=ax+8; G.pony.ty=ay+2;
      sayP("His ears have gone up. He can smell it. Come on... come on...");
    });
  });
}
function useRopeOnPony() {
  const s=G.pony.state;
  if(s==='eating') {
    removeItem('rope'); G.flags.ropeOnPony=true;
    G.pony.state='roped';
    sayP("Steady... steady...", ()=>{
      say('pony',"NEIGH!!", ()=>{
        sayP("Got him! He's tugging like a kite in a gale, but the rope holds.", ()=>{
          sayP("Now to calm him down before I lead him anywhere.");
        });
      });
    });
  } else if(s==='trot') {
    sayP("He's far too quick. I need him distracted first. Standing still. Eating, ideally.");
  } else if(s==='approach') {
    sayP("Almost... let him settle into the apple first.");
  } else if(s==='roped') {
    sayP("He's already roped. Now he needs a bit of community policing. The talking kind.");
  } else {
    sayP("The rope has done its work.");
  }
}
function calmPony() {
  G.pony.state='calm'; G.player.action='calm';
  sayP("Easy there, boy. Easy. Nobody's in trouble. Well — you are, slightly.", ()=>{
    say('pony',"...snrrt.", ()=>{
      G.player.action=null;
      sayP("He's nuzzling my hand. We're friends now. The press shall hear of this.", ()=>{
        sayP("Right. Back through the fence gap with you.");
      });
    });
  });
}
function tryReturnPony() {
  if(G.pony.state==='calm') {
    sayP("This way, lad. Mind the cones.", ()=>{
      G.pony.state='gone'; G.flags.ponyHome=true;
      say('pony',"*triumphant returning whinny*");
      say('narr',"07:15 AM — One Shetland pony, safely returned to his field.");
      say('paul',"And the herd pretends nothing happened. Typical.", ()=>{
        sayP("Hang on. Green jacket, notepad, purposeful walk... that's the press. Best look professional.", ()=>{
          say('narr',"07:20 AM — The hard shoulder. The press has arrived.", ()=>changeScene(3));
        });
      });
    });
  } else if(G.pony.state==='roped') {
    sayP("He's still doing the indignant dance. I should talk him down first.");
  } else {
    sayP("Step one: actually catch the pony. THEN the triumphant homecoming.");
  }
}

const WALKBOX = {
  1:{minX:16, maxX:306, minY:126, maxY:140},
  2:{minX:96, maxX:308, minY:100, maxY:138},
  3:{minX:12, maxX:308, minY:100, maxY:138},
};
function changeScene(n){ G.transition=60; G.nextScene=n; }
function initScene(n) {
  G.scene=n; G.hoverHot=null; G.dialog=null; resetCur();
  G.sayQ.length=0; G.sayCur=null;
  const p=G.player;
  p.walking=false; p.action=null; p.visible=true;
  if(n===1){ p.x=160;p.y=134; G.flags.phoneRinging=!G.flags.phoneAnswered; }
  if(n===2){ p.x=104;p.y=124; G.pony.x=210;G.pony.y=92;G.pony.tx=210;G.pony.ty=92;G.pony.state='trot';G.pony.timer=0; }
  if(n===3){ p.x=130;p.y=128; }
  p.tx=p.x; p.ty=p.y;
  renderBG(n);
}
function walkTo(x,y,cb) {
  const b=WALKBOX[G.scene];
  G.player.tx=Math.max(b.minX,Math.min(b.maxX,x));
  G.player.ty=Math.max(b.minY,Math.min(b.maxY,y));
  G.player.walking=true; G.walkCB=cb||null;
}
function updatePlayer() {
  const p=G.player;
  if(!p.walking) return;
  const dx=p.tx-p.x, dy=p.ty-p.y;
  const d=Math.sqrt(dx*dx+dy*dy);
  if(d<2) {
    p.walking=false; p.frame=0;
    if(G.walkCB){ const cb=G.walkCB; G.walkCB=null; cb(); }
    return;
  }
  p.x+=dx/d*WALK_SPEED;
  p.y+=dy/d*WALK_SPEED;
  p.frame+=0.14;
}

// ===== PONY AI =====
const PONY_WP=[{x:150,y:86},{x:230,y:94},{x:190,y:80},{x:265,y:90},{x:140,y:100},{x:250,y:104}];
function updatePony() {
  if(G.scene!==2 || G.pony.state==='gone') return;
  const p=G.pony;
  p.frame+=0.1;
  if(p.state==='trot') {
    const dx=p.tx-p.x, dy=p.ty-p.y, d=Math.sqrt(dx*dx+dy*dy);
    if(d<3) {
      if(++p.timer>80) {
        const wp=PONY_WP[Math.floor(Math.random()*PONY_WP.length)];
        p.tx=wp.x; p.ty=wp.y; p.timer=0;
      }
    } else { p.x+=dx/d*0.45; p.y+=dy/d*0.45; }
  } else if(p.state==='approach') {
    const dx=p.tx-p.x, dy=p.ty-p.y, d=Math.sqrt(dx*dx+dy*dy);
    if(d<4) { p.state='eating'; G.flags.appleEaten2=true; }
    else { p.x+=dx/d*0.35; p.y+=dy/d*0.35; }
  } else if(p.state==='roped'||p.state==='calm') {
    const dx=G.player.x+20-p.x, dy=G.player.y-16-p.y, d=Math.sqrt(dx*dx+dy*dy);
    if(d>30) { p.x+=dx/d*0.65; p.y+=dy/d*0.65; }
  }
}

//  VERB / SENTENCE ENGINE
// ============================================================
function buildSentence() {
  let s = cur.verb ? VLABEL[cur.verb] : 'Walk to';
  if(cur.item) s += ' ' + cur.item.name + (cur.verb==='give' ? ' to' : ' with');
  if(G.hoverHot) s += ' ' + G.hoverHot.label;
  else if(G.hoverInv>=0 && G.inventory[G.hoverInv] && !(cur.item && cur.item.id===G.inventory[G.hoverInv].id))
    s += ' ' + G.inventory[G.hoverInv].name;
  return s;
}
function execVerb(h, verb, item) {
  const run = ()=>{
    if(item) {
      const f = h.items && h.items[item.id];
      if(f) f(verb);
      else sayP(verb==='give' ? "I don't think it wants that." : "That doesn't seem to work.");
    } else {
      const f = h[verb];
      if(typeof f==='function') f();
      else sayP(DEFAULTS[verb]);
    }
  };
  resetCur();
  if(verb==='lookat' && !item) run();
  else walkTo(h.sx||h.x+h.w/2, h.sy||G.player.y, run);
}
function clickInventoryItem(item) {
  const v = cur.verb;
  if(!v || v==='lookat') { resetCur(); return sayP(item.desc); }
  if(v==='use' || v==='give') { cur.item=item; return; }   // await target
  if(v==='pickup') { resetCur(); return sayP("I've already got it."); }
  if(v==='talkto') { resetCur(); return sayP("Me and the "+item.name+" have an understanding. No words needed."); }
  if(v==='open' && item.id==='rope') { resetCur(); return sayP("It's a coil, not a knot."); }
  resetCur();
  sayP(DEFAULTS[v]);
}

// ============================================================
//  INPUT
// ============================================================
function sceneHotAt(x,y) {
  if(y>=SCENE_H) return null;
  const hs=getHotspots();
  for(const h of hs) if(x>=h.x&&x<h.x+h.w&&y>=h.y&&y<h.y+h.h) return h;
  return null;
}
function invSlotAt(x,y) {
  for(let i=0;i<6;i++) {
    const col=i%2, row=(i/2)|0;
    const sx=172+col*74, sy=UI_Y+2+row*14;
    if(x>=sx&&x<sx+72&&y>=sy&&y<sy+13) return i;
  }
  return -1;
}
function verbCellAt(x,y) {
  for(let i=0;i<9;i++) {
    const col=i%3, row=(i/3)|0;
    const vx=4+col*54, vy=UI_Y+2+row*14;
    if(x>=vx&&x<vx+52&&y>=vy&&y<vy+13) return i;
  }
  return -1;
}

function handleInput() {
  if(G.screen==='title') { if(clicked){ G.screen='game'; initScene(1); } clicked=false; rclicked=false; return; }
  if(G.screen==='end')   { if(clicked){ G.screen='title'; resetGame(); } clicked=false; rclicked=false; return; }

  if(G.transition>0) { clicked=false; rclicked=false; return; }

  // speech active: any click skips line
  if(sayBusy()) {
    if(clicked||rclicked) advanceSay();
    clicked=false; rclicked=false;
    return;
  }

  // dialogue choices active
  if(G.dialog) {
    if(clicked && G.dialog.hover>=0) {
      const d=G.dialog, c=d.choices[d.hover];
      G.dialog=null;
      d.cb(c);
    }
    clicked=false; rclicked=false;
    return;
  }

  if(rclicked) {
    rclicked=false;
    if(cur.verb||cur.item) { resetCur(); }
    else {
      const h=sceneHotAt(mx,my);
      if(h) execVerb(h, h.rverb||'lookat', null);
    }
  }

  if(!clicked) return;
  clicked=false;

  // UI panel
  if(my>=SCENE_H) {
    const vi=verbCellAt(mx,my);
    if(vi>=0) { cur.verb=VERBS[vi].id; cur.item=null; return; }
    const si=invSlotAt(mx,my);
    if(si>=0 && G.inventory[si]) clickInventoryItem(G.inventory[si]);
    return;
  }

  // scene click
  const h=sceneHotAt(mx,my);
  if(cur.item) {                       // "Use X with ___" / "Give X to ___"
    if(h) execVerb(h, cur.verb, cur.item);
    else resetCur();
    return;
  }
  if(cur.verb) {
    if(h) execVerb(h, cur.verb, null);
    else { resetCur(); walkTo(mx,my); }
    return;
  }
  // no verb: walk (hotspots may intercept walk)
  if(h && h.walkto) { execVerb(h,'walkto',null); }
  else if(h) walkTo(h.sx||mx, h.sy||my);
  else walkTo(mx,my);
}

function updateHover() {
  G.hoverHot=null; G.hoverVerb=-1; G.hoverInv=-1;
  if(G.screen!=='game' || sayBusy() || G.transition>0) return;
  if(G.dialog) {
    G.dialog.hover=-1;
    for(let i=0;i<G.dialog.choices.length;i++) {
      const cy=UI_Y+4+i*13;
      if(mx>=6&&mx<W-6&&my>=cy-2&&my<cy+11) G.dialog.hover=i;
    }
    return;
  }
  if(my<SCENE_H) { G.hoverHot=sceneHotAt(mx,my); return; }
  G.hoverVerb=verbCellAt(mx,my);
  const si=invSlotAt(mx,my);
  if(si>=0 && G.inventory[si]) G.hoverInv=si;
}

function resetGame() {
  G.scene=1; G.inventory.length=0; G.flags={}; G.journChoices.length=0;
  G.sayQ.length=0; G.sayCur=null; G.dialog=null; resetCur();
  G.pony.state='trot';
}

// ============================================================
//  UI RENDERING
// ============================================================
function drawPanel() {
  R(0,SCENE_H,W,H-SCENE_H,'#000');
  R(0,SCENE_H,W,1,'#3a3a48');
  R(0,SCENE_H+1,W,1,'#14141c');

  // sentence line
  TXT(buildSentence(), W/2, SENT_Y+1, (cur.verb||cur.item) ? '#e8e8a0' : '#9898e8', 'center');

  if(G.dialog) { drawDialogPanel(); return; }

  // verb grid
  for(let i=0;i<9;i++) {
    const col=i%3, row=(i/3)|0;
    const vx=4+col*54, vy=UI_Y+2+row*14;
    const sel = cur.verb===VERBS[i].id;
    const hov = G.hoverVerb===i;
    TXT(VERBS[i].label, vx+4, vy+3, sel ? '#ffff66' : hov ? '#8fff8f' : '#3fbf3f');
  }
  // divider
  R(166,UI_Y+2,1,40,'#2a2a34');
  // inventory
  for(let i=0;i<6;i++) {
    const col=i%2, row=(i/2)|0;
    const sx=172+col*74, sy=UI_Y+2+row*14;
    const it=G.inventory[i];
    if(!it) continue;
    const hov = G.hoverInv===i;
    const sel = cur.item && cur.item.id===it.id;
    drawItemIcon(it.id, sx, sy+1);
    TXT(it.name, sx+13, sy+3, sel ? '#ffff66' : hov ? '#8fff8f' : '#3fbf3f');
  }
}
function drawDialogPanel() {
  const d=G.dialog;
  for(let i=0;i<d.choices.length;i++) {
    const cy=UI_Y+4+i*13;
    const hov=d.hover===i;
    if(hov){ cx_.fillStyle='#ffff88';
      cx_.fillRect(4,cy+1,1,5); cx_.fillRect(5,cy+2,1,3); cx_.fillRect(6,cy+3,1,1); }
    TXT(d.choices[i].label, 10, cy, hov ? '#ffff88' : '#b8a8d8');
  }
}
function drawCursor() {
  // SCUMM crosshair
  const c = G.hoverHot ? '#ffff88' : '#e8e8e8';
  R(mx-1,my-5,3,3,'#000'); R(mx-1,my+3,3,3,'#000');
  R(mx-5,my-1,3,3,'#000'); R(mx+3,my-1,3,3,'#000');
  R(mx,my-4,1,2,c); R(mx,my+3,1,2,c);
  R(mx-4,my,2,1,c); R(mx+3,my,2,1,c);
}

// ============================================================
//  TITLE & END SCREENS
// ============================================================
function drawTitle() {
  // pre-dawn sky into dawn glow at horizon
  DGRAD(0,0,W,150,['#04041a','#0a0a2e','#141040','#2a1650','#582458','#a04850','#e08848']);
  // starfield (upper sky only)
  for(let i=0;i<40;i++) {
    const sx=(i*97+33)%W, sy=(i*53+17)%90+4;
    const b=Math.sin(G.tick*0.05+i)*0.3+0.6;
    cx_.fillStyle=`rgba(220,220,255,${b})`;
    cx_.fillRect(sx,sy,1,1);
  }
  // moon
  PDISC(276,26,7,'#e8e8d0'); PDISC(273,24,6,'#f4f4e2'); R(277,28,2,1,'#d0d0b8');
  // treeline silhouette
  for(let tx=0;tx<W;tx+=8) {
    const th=5+Math.sin(tx*0.27)*3+Math.cos(tx*0.61)*2;
    R(tx,148-th,8,th+4,'#0a1408');
  }
  // road
  DGRAD(0,150,W,50,['#42424a','#3a3a42','#32323a']);
  SPECK(0,152,W,46,'#4a4a54',13,2);
  R(0,150,W,2,'#e8e8e8');
  for(let lx=-((G.tick*0.8)%24);lx<W;lx+=24) R(lx,172,12,2,'#ddd');
  // trotting pony silhouette (lit by dawn from behind)
  const px=160+Math.sin(G.tick*0.02)*60;
  const pf=Math.floor(G.tick/8)%2?1:-1;
  R(px-10,140,21,12,'#c08a18'); R(px-9,139,19,1,'#dca42e');
  R(px-17,135,8,9,'#c08a18'); R(px-19,138,4,4,'#96690c');
  R(px-15,133,2,3,'#c08a18');
  R(px-12,132,9,4,'#4a2e12'); R(px-6,135,4,5,'#4a2e12');
  R(px+9,138,3,7,'#4a2e12'); R(px+10,144,3,5,'#4a2e12');
  R(px-16,137,2,2,'#fff'); R(px-15,137,1,2,'#180f06');
  R(px-8+pf,152,3,7,'#96690c'); R(px-2-pf,152,3,7,'#96690c');
  R(px+3+pf,152,3,7,'#96690c'); R(px+7-pf,152,3,7,'#96690c');
  R(px-8+pf,158,3,1,'#2a2118'); R(px-2-pf,158,3,1,'#2a2118');
  R(px+3+pf,158,3,1,'#2a2118'); R(px+7-pf,158,3,1,'#2a2118');
  // distant blue lights on the horizon
  if(Math.floor(G.tick/10)%2) { R(40,154,8,3,'#5566ff'); R(270,158,8,3,'#5566ff'); }
  else { R(40,154,8,3,'#222a66'); R(270,158,8,3,'#222a66'); }
  // ---- title: big pixel lettering, MI-style two-tone with drop shadow ----
  TXT('PONY QUEST', W/2+3, 33, '#241008', 'center', 3);
  TXT('PONY QUEST', W/2, 30, '#f0c838', 'center', 3);
  TXT('PONY QUEST', W/2-1, 29, '#ffe87a', 'center', 3);
  TXT('The Secret of the M25', W/2+1, 58, '#5a3010', 'center');
  TXT('The Secret of the M25', W/2, 57, '#e8a040', 'center');
  TXT('A Thames Valley Police Adventure', W/2, 84, '#9a9ac8', 'center');
  TXT('Based on true events - 10 October 2003', W/2, 96, '#8888aa', 'center');
  TXT('(c) 2003 Anthem Bros. Entertainment', W/2, 110, '#666688', 'center');
  if(Math.floor(G.tick/30)%2)
    OTXT(TOUCH?'Tap to begin':'Click to begin', W/2, 128, '#eeeeff', 'center');
  if(TOUCH)
    OTXT('Tap: act - Double-tap: look', W/2, 189, '#a8a8c8', 'center');
}

function drawEndScreen() {
  DGRAD(0,0,W,H,['#0a0a1c','#0e0e24','#12122c']);
  let pro=0,fun=0,drama=0;
  for(const t of G.journChoices){ if(t==='pro')pro++; if(t==='fun')fun++; if(t==='drama')drama++; }
  let headline, subline;
  if(pro>=2)       { headline="POLICE HANDLE PONY ESCAPE";       subline="WITH DIGNITY, SAYS SPOKESMAN"; }
  else if(fun>=2)  { headline="PONY'S M25 JOLLY ENDS IN";        subline="APPLE-BASED DIPLOMACY"; }
  else if(drama>=2){ headline="HERO COP IN M25 STANDOFF";        subline="WITH ROGUE SHETLAND"; }
  else             { headline="LOOSE SHETLAND CLOSES M25";       subline="safely home after 47 minutes"; }

  TXT('PONY QUEST', W/2+2, 12, '#241008', 'center', 2);
  TXT('PONY QUEST', W/2, 11, '#f0c838', 'center', 2);
  TXT('The Secret of the M25', W/2, 30, '#c0a030', 'center');
  TXT('CASE CLOSED', W/2, 44, '#8888aa', 'center');

  // the Horse & Hound front page
  R(56,56,208,106,'#4a4436');              // page shadow
  R(54,54,208,106,'#f2ecda');
  R(54,54,208,1,'#fffbee');
  R(54,54,208,4,'#2e2614'); R(54,58,208,1,'#4a4436');
  TXT('HORSE & HOUND', W/2, 64, '#2e2614', 'center', 2);
  R(70,80,180,1,'#2e2614'); R(70,82,180,1,'#8a8270');
  TXT('EST. 1884', 72, 85, '#6a6252');
  TXT('60p', 248, 85, '#6a6252', 'right');
  R(70,93,180,1,'#b8b0a0');
  TXT(headline, W/2, 98, '#181408', 'center');
  TXT(subline, W/2, 108, '#181408', 'center');
  TXT('Sarah Collins, 10 October 2003', W/2, 122, '#5a5242', 'center');
  // photo box: the pony, immortalised
  R(84,130,44,26,'#c8c0ac'); R(85,131,42,24,'#9a9280');
  R(96,140,16,7,'#4a3a18'); R(92,137,6,5,'#4a3a18'); R(94,134,7,3,'#2e2410');
  R(97,147,2,4,'#382c10'); R(103,147,2,4,'#382c10'); R(108,147,2,4,'#382c10');
  TXT('"Excited, not', 136, 132, '#3a3222');
  TXT('distressed."', 136, 141, '#3a3222');
  TXT('Full story p.3', 136, 152, '#5a5242');

  if(Math.floor(G.tick/30)%2)
    OTXT(TOUCH?'Tap to play again':'Click to play again', W/2, 178, '#ccccee', 'center');
}

// ============================================================
//  MAIN
// ============================================================
function drawGame() {
  // prerendered background
  cx_.drawImage(bg,0,0);
  // dynamic background bits
  if(G.scene===1) drawStationDyn();
  else if(G.scene===2) drawMotorwayDyn();
  else drawPressDyn();

  const talking = G.sayCur ? G.sayCur.actor : null;

  // depth-sorted actors (by feet y)
  const actors=[];
  if(G.scene===2 && G.pony.state!=='gone')
    actors.push({y:G.pony.y, draw:()=>drawPonySprite(G.pony.x,G.pony.y,G.pony.frame,G.pony.state)});
  if(G.scene===3)
    actors.push({y:124, draw:()=>drawJournalist(210,124,talking==='journ')});
  if(G.player.visible)
    actors.push({y:G.player.y, draw:()=>drawPaul(G.player.x,G.player.y,G.player.frame,G.player.walking,G.player.action,talking==='paul')});
  actors.sort((a,b)=>a.y-b.y);
  for(const a of actors) a.draw();

  drawPanel();
  drawSay();

  if(G.transition>0) {
    const fa = G.transition>30 ? (60-G.transition)/30 : G.transition/30;
    cx_.fillStyle=`rgba(0,0,0,${fa})`;
    cx_.fillRect(0,0,W,H);
  }
  drawCursor();
}

function loop() {
  G.tick++;
  if(G.transition>0) {
    G.transition--;
    if(G.transition===30) initScene(G.nextScene);
  }
  if(G.screen==='game' && G.transition===0) {
    updateSay();
    if(!sayBusy() && !G.dialog) { updatePlayer(); updatePony(); }
    else if(G.player.walking) updatePlayer();   // finish a walk that a cutscene started
  }
  updateHover();
  handleInput();

  cx_=fctx;
  cx_.clearRect(0,0,W,H);
  if(G.screen==='title') { drawTitle(); drawCursor(); }
  else if(G.screen==='end') { drawEndScreen(); drawCursor(); }
  else drawGame();

  dctx.clearRect(0,0,display.width,display.height);
  dctx.drawImage(buf,0,0,display.width,display.height);
  requestAnimationFrame(loop);
}
loop();
</script>
