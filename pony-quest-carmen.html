//  WHERE ON THE M25 IS THE SHETLAND PONY?
//  A Carmen Sandiego-style investigation of the real M25

const W = 320, H = 200;
const SC_X = 2, SC_Y = 13, SC_W = 316, SC_H = 92;   // scene window

// ===== CANVAS =====
const display = document.getElementById('c');
const dctx = display.getContext('2d');
const buf = document.createElement('canvas');
buf.width = W; buf.height = H;
const fctx = buf.getContext('2d');
const bg = document.createElement('canvas');
bg.width = SC_W; bg.height = SC_H;
const bgctx = bg.getContext('2d');
let cx_ = fctx;

function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const dpr = window.devicePixelRatio || 1;
  const f = Math.min(vw * dpr / W, vh * dpr / H);
  const s = Math.max(1, Math.floor(f));
  display.width = W * s; display.height = H * s;
  if (dpr >= 2 || f < 1) {
    display.style.width  = Math.floor(W * f / dpr) + 'px';
    display.style.height = Math.floor(H * f / dpr) + 'px';
  } else {
    display.style.width  = (W * s / dpr) + 'px';
    display.style.height = (H * s / dpr) + 'px';
  }
  dctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 100));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
document.addEventListener('fullscreenchange', resize);
resize();

// ===== PIXEL HELPERS =====
function R(x,y,w,h,c) { cx_.fillStyle=c; cx_.fillRect(x,y,w,h); }
const BAYER4=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
function DGRAD(x,y,w,h,cols) {
  const n=cols.length, bh=h/n;
  for(let i=0;i<n;i++) R(x, Math.floor(y+i*bh), w, Math.ceil(bh)+1, cols[i]);
  for(let i=1;i<n;i++) {
    const by=Math.floor(y+i*bh);
    const cfg=[[-1,4,cols[i]],[0,8,cols[i]],[1,4,cols[i-1]]];
    for(const r of cfg){
      const yy=by+r[0];
      if(yy<y||yy>=y+h) continue;
      cx_.fillStyle=r[2];
      for(let xx=x;xx<x+w;xx++) if(BAYER4[yy&3][xx&3]<r[1]) cx_.fillRect(xx,yy,1,1);
    }
  }
}
function DGRAD_S(x,y,w,h,cols) {
  const n=cols.length;
  for(let yy=0;yy<h;yy++){
    const t=n<=1?0:yy/(h-1)*(n-1);
    const i=Math.min(n-2,Math.floor(t)), ft=t-i;
    const c1=cols[i], c2=cols[i+1];
    R(x,y+yy,w,1,c1);
    if(ft>0.01){ cx_.fillStyle=c2; const lim=ft*16;
      for(let xx=x;xx<x+w;xx++) if(BAYER4[(y+yy)&3][xx&3]<lim) cx_.fillRect(xx,y+yy,1,1);
    }
  }
}
function DITH(x,y,w,h,c,den){
  cx_.fillStyle=c;
  for(let yy=y;yy<y+h;yy++) for(let xx=x;xx<x+w;xx++)
    if(BAYER4[yy&3][xx&3]<den) cx_.fillRect(xx,yy,1,1);
}
function PLINE(x0,y0,x1,y1,c,w) {
  w=w||1;
  const dx=x1-x0, dy=y1-y0, n=Math.max(Math.abs(dx),Math.abs(dy),1);
  cx_.fillStyle=c;
  for(let i=0;i<=n;i++)
    cx_.fillRect(Math.round(x0+dx*i/n), Math.round(y0+dy*i/n), w, w);
}
function PDISC(cx,cy,r,c) {
  cx_.fillStyle=c;
  for(let y=-r;y<=r;y++){
    const hw=Math.floor(Math.sqrt(r*r-y*y)+0.5);
    cx_.fillRect(Math.round(cx-hw),Math.round(cy+y),hw*2+1,1);
  }
}
// deterministic per-index random (stable across frames)
function rr(i){ const s=Math.sin(i*127.1+3.7)*43758.545; return s-Math.floor(s); }

// ===== BITMAP FONT (5x7) =====
const FONT5={
A:'0E11111F111111',B:'1E11111E11111E',C:'0E11101010110E',D:'1E11111111111E',
E:'1F10101E10101F',F:'1F10101E101010',G:'0E11101711110F',H:'1111111F111111',

M:'111B1515111111',N:'11191513111111',O:'0E11111111110E',P:'1E11111E101010',
Q:'0E11111115120D',R:'1E11111E141211',S:'0F10100E01011E',T:'1F040404040404',
U:'1111111111110E',V:'11111111110A04',W:'1111111515150A',X:'11110A040A1111',
Y:'11110A04040404',Z:'1F01020408101F',
a:'00000E010F110F',b:'10101E1111111E',c:'00000F1010100F',d:'01010F1111110F',
e:'00000E111F100E',f:'06081C08080808',g:'00000F110F010E',h:'10101E11111111',
i:'04000C0404040E',j:'0200060202120C',k:'10101214181412',l:'0C04040404040E',
m:'00001A15151515',n:'00001E11111111',o:'00000E1111110E',p:'00001E111E1010',
q:'00000F110F0101',r:'00001619101010',s:'00000F100E011E',t:'08081C08080906',
u:'0000111111130D',v:'00001111110A04',w:'0000111115150A',x:'0000110A040A11',
y:'000011110F010E',z:'00001F0204081F',

'4':'02060A121F0202','5':'1F101E0101110E','6':'0608101E11110E','7':'1F010204080808',

};
const GLYPH={};
for(const k in FONT5){ const s=FONT5[k],r=[]; for(let i=0;i<7;i++) r.push(parseInt(s.substr(i*2,2),16)||0); GLYPH[k]=r; }
function normTxt(t){ return String(t).replace(/—/g,'-').replace(/…/g,'...').replace(/[‘’]/g,"'").replace(/[“”]/g,'"'); }
function textW(t,s){ s=s||1; return normTxt(t).length*6*s-s; }
function TXT(t,x,y,c,align,s) {
  s=s||1; t=normTxt(t);
  if(align==='center') x-=textW(t,s)/2;
  else if(align==='right') x-=textW(t,s);
  x=Math.round(x); y=Math.round(y);
  cx_.fillStyle=c;
  for(const ch of t) {
    const g=GLYPH[ch];
    if(g) for(let r=0;r<7;r++){ const v=g[r]; if(!v) continue;
      for(let col=0;col<5;col++) if(v&(16>>col)) cx_.fillRect(x+col*s,y+r*s,s,s);
    }
    x+=6*s;
  }
}
function OTXT(t,x,y,c,align,s) {
  for(let ox=-1;ox<=1;ox++) for(let oy=-1;oy<=1;oy++)
    if(ox||oy) TXT(t,x+ox,y+oy,'#000',align,s);
  TXT(t,x,y,c,align,s);
}
// 3x5 micro font for signage
const FONT3={
A:'25755',B:'65656',C:'34443',D:'65556',E:'74647',F:'74644',G:'34553',H:'55755',
I:'72227',J:'11152',K:'56655',L:'44447',M:'57555',N:'65555',O:'75557',P:'65644',
R:'65655',S:'34216',T:'72222',U:'55557',V:'55552',X:'55255',Y:'55222',
'0':'75557','1':'26227','2':'61247','4':'55711','5':'74616','6':'34757',' ':'00000',
};
function TXT3(t,x,y,c,s) {
  s=s||1;
  cx_.fillStyle=c; x=Math.round(x); y=Math.round(y);
  for(const ch of t) {
    const g=FONT3[ch];
    if(g) for(let r=0;r<5;r++){ const v=parseInt(g[r],16);
      for(let col=0;col<3;col++) if(v&(4>>col)) cx_.fillRect(x+col*s,y+r*s,s,s);
    }
    x+=4*s;
  }
}
function t3w(t,s){ return t.length*4*(s||1)-(s||1); }
function wrapText(t, max) {
  t=normTxt(t);
  const words=t.split(' '), lines=[];
  let cur='';
  for(const w of words) {
    if((cur+' '+w).trim().length>max) { lines.push(cur.trim()); cur=w; }
    else cur+=' '+w;
  }
  if(cur.trim()) lines.push(cur.trim());
  return lines;
}

// ===== AUDIO ENGINE =====
let AC=null, masterGain=null, comp=null, noiseBufShort=null;
let musicOn=true, seqNext=0, seqStep=0, curTrack=null;
const STEP8=60/120/2;
function buildNoise(dur){
  const b=AC.createBuffer(1,(AC.sampleRate*dur)|0,AC.sampleRate);
  const d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  return b;
}
function pulse(midi,t,dur,vol){
  if(!AC) return;
  const o=AC.createOscillator(); o.type='square';
  o.frequency.setValueAtTime(440*Math.pow(2,(midi-69)/12),t);
  const g=AC.createGain();
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+0.004);
  g.gain.linearRampToValueAtTime(vol*0.6,t+0.05);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur+0.05);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t+dur+0.08);
}
function bassN(midi,t,dur,vol){
  if(!AC) return;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type='triangle';
  o.frequency.setValueAtTime(440*Math.pow(2,(midi-69)/12),t);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+0.01);
  g.gain.setValueAtTime(vol*0.7,t+dur*0.6);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur+0.04);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t+dur+0.06);
}
function padC(midis,t,dur,vol){
  if(!AC) return;
  for(const m of midis){
    const o=AC.createOscillator(), g=AC.createGain();
    o.type='sine'; o.frequency.setValueAtTime(440*Math.pow(2,(m-69)/12),t);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+0.08);
    g.gain.setValueAtTime(vol,t+dur*0.7);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur+0.2);
    o.connect(g); g.connect(masterGain);
    o.start(t); o.stop(t+dur+0.25);
  }
}
function hat(t,dur,vol,hp){
  if(!AC) return;
  const s=AC.createBufferSource(); s.buffer=noiseBufShort;
  const f=AC.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp||7000;
  const g=AC.createGain();
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(masterGain);
  s.start(t); s.stop(t+dur+0.02);
}
function kick(t,vol){
  if(!AC) return;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(120,t);
  o.frequency.exponentialRampToValueAtTime(45,t+0.08);
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t+0.18);
}
// tracks: 32 8th-note steps
const TRACKS={
  // the case: wistful gumshoe minor
  case_:{
    lead:[69,0,0,72, 76,0,74,72, 69,0,0,0, 71,0,72,74,
          76,0,0,79, 77,0,76,74, 72,0,71,0, 69,0,0,0],
    bass:[45,0,45,0, 41,0,41,0, 43,0,43,0, 45,0,44,0,
          41,0,41,0, 43,0,43,0, 40,0,40,0, 45,0,0,0],
    pad:[[45,48,52],0,0,0, [41,45,48],0,0,0, [43,47,50],0,0,0, [45,48,52],0,0,0,
         [41,45,48],0,0,0, [43,47,50],0,0,0, [40,44,47],0,0,0, [45,48,52],0,0,0],
    drums:'light',
  },
  // out on the motorway: tense
  tense:{
    lead:[81,0,80,81, 0,84,0,81, 0,80,0,76, 0,0,77,80,
          81,0,80,81, 0,86,0,84, 0,81,0,80, 76,0,0,0],
    bass:[33,0,33,33, 0,33,0,36, 38,0,38,38, 0,38,0,41,
          40,0,40,40, 0,40,0,43, 45,0,44,0, 40,0,36,0],
    pad:0,
    drums:'drive',
  },
  // case closed: jaunty
  win:{
    lead:[76,79,84,0, 79,76,72,0, 74,77,81,0, 77,74,72,0,
          76,79,84,88, 86,84,81,0, 79,81,83,84, 84,0,0,0],
    bass:[48,0,52,0, 55,0,52,0, 50,0,53,0, 55,0,53,0,
          48,0,52,0, 55,0,57,0, 55,0,53,0, 48,0,0,0],
    pad:[[48,52,55],0,0,0, 0,0,0,0, [50,53,57],0,0,0, 0,0,0,0,
         [48,52,55],0,0,0, [53,57,60],0,0,0, [50,55,59],0,0,0, [48,52,55],0,0,0],
    drums:'jaunty',
  },
};
function initAudio(){
  if(AC) return;
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  masterGain=AC.createGain(); masterGain.gain.value=0.0;
  comp=AC.createDynamicsCompressor();
  comp.threshold.value=-14; comp.knee.value=12; comp.ratio.value=3; comp.attack.value=0.003; comp.release.value=0.12;
  masterGain.connect(comp); comp.connect(AC.destination);
  masterGain.gain.setValueAtTime(0,AC.currentTime);
  masterGain.gain.linearRampToValueAtTime(0.3,AC.currentTime+1.2);
  noiseBufShort=buildNoise(0.06);
  curTrack=TRACKS.case_;
  seqNext=AC.currentTime+0.1; seqStep=0;
  setInterval(seqSchedule,60);
}
function setTrack(name){
  const nt=TRACKS[name];
  if(nt && nt!==curTrack){ curTrack=nt; seqStep=0; if(AC) seqNext=Math.max(seqNext,AC.currentTime+0.1); }
}
function seqSchedule(){
  if(!AC||!curTrack) return;
  if(AC.state==='suspended') AC.resume();
  while(seqNext<AC.currentTime+0.3){
    if(musicOn){
      const i=seqStep%32, t=seqNext, tr=curTrack;
      const L=tr.lead, B=tr.bass, P=tr.pad, D=tr.drums;
      if(L&&L[i]) pulse(L[i],t,STEP8*0.92,0.15);
      if(B&&B[i]) bassN(B[i],t,STEP8*1.8,0.2);
      if(P&&P[i]) padC(P[i],t,STEP8*4,0.045);
      if(D==='light'){ if(i%4===0) hat(t,0.04,0.04,8000); if(i%8===4) kick(t,0.1); }
      else if(D==='drive'){ if(i%2===0) hat(t,0.03,0.05,7500); if(i%4===0) kick(t,0.16); if(i%8===4) hat(t,0.08,0.09,4000); }
      else if(D==='jaunty'){ if(i%4===0) hat(t,0.04,0.05,8000); if(i%4===2) kick(t,0.13); if(i%8===6) hat(t,0.06,0.07,5000); }
    }
    seqStep++;
    seqNext+=STEP8;
  }
}
// sfx
function sfxClick(){ if(AC) pulse(88,AC.currentTime,0.03,0.05); }
function sfxPage(){ if(AC) pulse(83,AC.currentTime,0.03,0.05); }
function sfxClue(){ if(!AC) return; const t=AC.currentTime; [76,80,83,88].forEach((m,i)=>pulse(m,t+i*0.07,0.08,0.1)); }
function sfxStamp(){ if(!AC) return; kick(AC.currentTime,0.3); bassN(33,AC.currentTime,0.15,0.3); }
function sfxWrong(){ if(!AC) return; const t=AC.currentTime; bassN(44,t,0.14,0.22); bassN(38,t+0.18,0.3,0.22); }
function sfxTravel(){ if(!AC) return; const t=AC.currentTime; hat(t,0.35,0.12,1500); bassN(36,t,0.3,0.18); }
function sfxFanfare(){ if(!AC) return; const t=AC.currentTime; [72,76,79,84,88].forEach((m,i)=>pulse(m,t+i*0.09,0.14,0.13)); padC([60,64,67],t+0.4,0.8,0.06); }

const muToggle=e=>{

  musicOn=!musicOn;

muBtn.addEventListener('click',muToggle);

fsBtn.addEventListener('click',e=>{

  else document.exitFullscreen();
});

let G=null, tick=0;
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }
function newGame(){
  const culprit=(Math.random()*PONIES.length)|0;
  // assign one trait category to each of locations 0..3 (shuffled)
  const cats=shuffle([0,1,2,3]);
  // build witness pages: flavour + clue page (clue pages flagged)
  const trail=TRAIL.map((L,li)=>{
    const ws=L.witnesses.map(w=>{
      const pages=w.flav.map(t=>({t,clue:null}));
      if(w.role==='route' && li<4) pages.push({t:ROUTECLUE[li],clue:{type:'route',loc:li}});
      if(w.role==='trait' && li<4){
        const c=CATS[cats[li]];
        pages.push({t:CLUETEXT[c.key][PONIES[culprit][c.key]],clue:{type:'trait',cat:cats[li]}});
      }
      return {...w,pages};
    });
    // travel options: correct next + 3 decoys
    let opts=null;
    if(li<4){
      const d=shuffle(DECOYS.slice()).slice(0,3).map(x=>({...x,decoy:true}));
      opts=shuffle([{n:TRAIL[li+1].short,b:'Follow the trail.',next:li+1},...d]);
    }
    return {...L,witnesses:ws,opts};
  });
  G={
    mode:'title', mins:0, loc:0, trail, culprit,
    talked:{}, seenClue:{}, routeKnown:[], traits:{mane:null,height:null,temper:null,feat:null},
    warrant:null, dexSel:-1, wrongTurns:0, interviews:0,
    pages:[], page:0, pageDone:null, pagePortrait:null, pageName:'', pageJob:'',
    msg:null, decoy:null, mx:-9, my:-9, bgKey:'', endKind:'', caughtAt:0,
    tickerX:W,
  };
  setMsg(trail[0].ambient);
}
function setMsg(t){ G.msg=wrapText(t,51); }
function clockStr(m){ m=390+m; return ('0'+((m/60)|0)).slice(-2)+':'+('0'+(m%60)).slice(-2); }
function addMins(n){
  G.mins+=n;
  if(G.mins>=90 && G.mode!=='end'){ endGame('gridlock'); }
}
function skyPhase(){ return G.mins<15?0 : G.mins<40?1 : 2; }
function endGame(kind){
  G.endKind=kind; G.mode='end'; G.bgKey='';
  if(kind==='win'){ setTrack('win'); sfxFanfare(); }
  else { sfxWrong(); }
}
function rankFor(m){
  if(m<=45) return 'CHIEF INSPECTOR OF PONIES';
  if(m<=67) return 'DETECTIVE SERGEANT (MOUNTED)';
  return 'SPECIAL CONSTABLE (PROBATIONARY)';
}

function shade(hex,d){
  const n=parseInt(hex.slice(1),16);
  const r=Math.max(0,Math.min(255,(n>>16)+d)),g=Math.max(0,Math.min(255,((n>>8)&255)+d)),b=Math.max(0,Math.min(255,(n&255)+d));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

function drawPonyP(x,y,p){
  DGRAD(x,y,40,40,['#3a5a2e','#2e4a24','#243a1c']);
  DITH(x,y+32,40,8,'#4a6a34',6);
  const coat=p.coat, dk=shade(coat,-40), mn=MANEC[p.mane];
  // neck+shoulder
  R(x+2,y+26,20,14,coat); R(x+2,y+26,20,2,shade(coat,20));
  // head: forehead block + muzzle block
  R(x+14,y+6,16,16,coat); R(x+8,y+16,14,12,coat);
  R(x+8,y+26,10,2,dk); // chin
  // ears
  const t=p.temper;
  if(t===0){ R(x+16,y+1,3,6,coat); R(x+24,y+1,3,6,coat); R(x+17,y+2,1,4,dk); R(x+25,y+2,1,4,dk); }
  else if(t===1){ R(x+13,y+4,5,3,coat); R(x+24,y+3,4,4,coat); }
  else { R(x+16,y+2,3,5,coat); R(x+24,y+4,4,3,coat); }
  // mane + forelock
  R(x+28,y+4,6,26,mn); DITH(x+26,y+6,4,22,mn,8);
  R(x+15,y+5,10,3,mn); R(x+14,y+7,4,4,mn);
  // eye by temperament
  if(t===0){ R(x+20,y+12,3,3,'#141210'); R(x+20,y+12,1,1,'#fff'); R(x+19,y+10,5,1,dk); }
  else if(t===1){ R(x+20,y+13,3,2,'#141210'); PLINE(x+19,y+11,x+23,y+12,dk); R(x+21,y+16,1,2,'#6898d8'); }
  else { R(x+20,y+13,3,2,'#141210'); R(x+20,y+12,3,1,dk); }
  // nostril + mouth
  R(x+10,y+22,2,2,dk);
  if(p.feat===3){ R(x+9,y+25,7,2,'#e8e4d8'); R(x+9,y+24,7,1,dk); } // teeth
  else PLINE(x+9,y+25,x+14,y+25,dk);
  // white star
  if(p.feat===0){ R(x+21,y+8,2,2,'#f0ece0'); R(x+20,y+9,4,1,'#f0ece0'); R(x+21,y+7,2,1,'#f0ece0'); }
  // magnificent tail sweeping in
  if(p.feat===2){ for(let i=0;i<14;i++){ const xx=x+2+i, yy=y+38-Math.round(Math.sin(i*0.4)*8)-i; R(xx,yy,2,6,mn); } }
  // one white sock
  if(p.feat===1){ R(x+4,y+34,4,6,coat); R(x+4,y+37,4,3,'#f0ece0'); R(x+4,y+39,4,1,'#181410'); }
  // coat dapple
  DITH(x+3,y+28,18,8,shade(coat,14),4);
}

function BTN(x,y,w,h,label,fn,o){

    if((tick>>3)&1){ R(SC_X+b.x,SC_Y+b.y,2,2,'#4a6aff'); DITH(SC_X+b.x-4,SC_Y+b.y-3,10,7,'#4a6aff50',5); }
    else R(SC_X+b.x,SC_Y+b.y,2,2,'#1a2a80');
  }
}
// the fugitive, drawn live (bobbing) on motorway scenes
function livePony(){
  const c=PONIES[G.culprit];
  if(G.trail[G.loc].id==='carr'){
    const bob=Math.round(Math.sin(tick*0.15));
    ponySil(SC_X+120+Math.round(Math.sin(tick*0.02)*6),SC_Y+52+bob,'#3a2c20',MANEC[c.mane]);
    if((tick>>5)%3===0) DITH(SC_X+112,SC_Y+56,8,4,'#a8a09060',5);
  }
  if(G.trail[G.loc].id==='resv'){
    const munch=((tick>>4)&1);
    const px=SC_X+150, py=SC_Y+44;
    R(px,py,16,8,c.coat); R(px+13,py-5+(munch?3:0),5,6,c.coat); R(px+16,py-7+(munch?3:0),5,4,c.coat);
    R(px+1,py+7,2,5,c.coat); R(px+5,py+7,2,5,c.coat); R(px+9,py+7,2,5,c.coat); R(px+13,py+7,2,5,c.coat);
    R(px+12,py-7+(munch?3:0),3,3,MANEC[c.mane]); R(px-3,py-1,3,5,MANEC[c.mane]);
  }
}

  TXT('WHERE ON THE M25 IS',W/2,26,'#f0e8d0','center',2);

  TXT('AN EQUINE INCIDENT BUREAU CASE FILE',W/2,68,'#8a94b8','center');

  hit(0,0,W,H,()=>{ sfxClick(); G.mode='brief'; G.pages=startPages(BRIEF_PAGES.map(t=>({t}))); G.page=0;
    G.pagePortrait=P_PAUL; G.pageName='PAUL ANTHEM'; G.pageJob='TVP Press Office';
    G.pageDone=()=>{ G.mode='scene'; setMsg(G.trail[0].ambient); }; });
}
function drawTextPanel(){
  PANEL(2,106,316,62);
}
// split raw pages into 3-line screens so text never collides with the button
function startPages(raw){
  const out=[];
  for(const p of raw){
    const lines=wrapText(p.t,42);
    for(let i=0;i<lines.length;i+=3) out.push({lines:lines.slice(i,i+3),clue:p.clue||null});
  }
  return out;
}
function drawPages(){
  drawTextPanel();
  const p=G.pages[G.page];
  const tx=60;
  PANEL(6,110,48,48);
  if(G.pageP) drawPonyP(10,114,G.pageP); else drawFace(10,114,G.pagePortrait||P_PAUL);
  if(G.pageName){
    TXT(G.pageName,tx,111,'#ffd858');
    TXT(' - '+G.pageJob,tx+textW(G.pageName),111,'#8a94b8');
  }
  const col=p.clue?'#ffd858':'#d8dce8';
  for(let i=0;i<p.lines.length;i++) TXT(p.lines[i],tx,122+i*9,col);
  if(p.clue) TXT('* NOTED IN CASEBOOK *',tx,151,'#68d868');
  const last=G.page>=G.pages.length-1;
  const adv=()=>{
    sfxPage();
    if(last){ const d=G.pageDone; G.pageDone=null; G.pageP=null; G.pagePortrait=null; G.pageName=''; if(d) d(); }
    else { G.page++; noteClue(G.pages[G.page]); }
  };
  hit(2,106,316,62,adv);
  BTN(258,148,54,16,last?'DONE':'MORE',adv);
}
function noteClue(p){
  if(!p||!p.clue) return;
  const k=JSON.stringify(p.clue);
  if(G.seenClue[k]) return;
  G.seenClue[k]=1;
  sfxClue();
  if(p.clue.type==='route'){ G.routeKnown.push(p.clue.loc); }
  else { const c=CATS[p.clue.cat]; G.traits[c.key]=PONIES[G.culprit][c.key]; }
}
function drawBrief(){
  topBar('CASE NO. 251003 - BRIEFING');
  sceneFrame('office');
  marquee();
  drawPages();
  drawButtons(true);
}
function drawButtons(dis){
  const last=G.loc===4;
  BTN(2,171,78,26,'QUESTION',()=>{ sfxClick(); G.mode='pick'; },{dis});
  if(last) BTN(82,171,78,26,'CORNER IT',()=>{ sfxClick(); tryCapture(); },{red:1,flash:1,dis});
  else BTN(82,171,78,26,'TRAVEL',()=>{ sfxClick(); G.mode='travel'; },{dis});
  BTN(162,171,78,26,'PONY-DEX',()=>{ sfxClick(); G.dexSel=-1; G.mode='dex'; },{dis});
  BTN(242,171,76,26,'CASEBOOK',()=>{ sfxClick(); G.mode='notes'; },{dis});
}
function drawScene(){
  const L=G.trail[G.loc];
  topBar(L.short);
  sceneFrame(L.id);
  livePony();
  marquee();
  drawTextPanel();
  if(G.msg) for(let i=0;i<G.msg.length&&i<6;i++) TXT(G.msg[i],8,113+i*9,'#d8dce8');
  drawButtons(false);
}
function drawPick(){
  const L=G.trail[G.loc];
  topBar(L.short);
  sceneFrame(L.id);
  livePony();
  marquee();
  drawTextPanel();
  TXT('QUESTION WHO? (2 MIN)',8,110,'#ffd858');
  L.witnesses.forEach((w,i)=>{
    const done=G.talked[G.loc+':'+i];
    BTN(8,120+i*15,230,14,(done?'* ':'')+w.name+' - '+w.job,()=>{
      sfxClick();
      addMins(done?1:2);
      if(G.mode==='end') return;
      if(!done) G.interviews++;
      G.talked[G.loc+':'+i]=1;
      G.pages=startPages(w.pages); G.page=0;
      G.pagePortrait=w.p; G.pageP=w.ponyP||null;
      G.pageName=w.name; G.pageJob=w.job;
      noteClue(w.pages[0]);
      G.pageDone=()=>{ G.mode='scene'; setMsg(L.ambient); };
      G.mode='talk';
    });
  });
  BTN(252,120,60,14,'CANCEL',()=>{ sfxClick(); G.mode='scene'; });
  drawButtons(true);
}
function drawTalk(){
  const L=G.trail[G.loc];
  topBar(L.short);
  sceneFrame(L.id);
  livePony();
  marquee();
  drawPages();
  drawButtons(true);
}
function drawTravel(){
  const L=G.trail[G.loc];
  topBar('TRAVEL');
  PANEL(2,13,316,184-13+14);
  TXT('WHERE TO, DETECTIVE?',W/2,22,'#ffd858','center');
  TXT('The Vauxhall Astra awaits. Each trip: 5 minutes.',W/2,34,'#8a94b8','center');
  L.opts.forEach((o,i)=>{
    BTN(12,48+i*28,296,24,o.n,()=>{
      sfxTravel();
      addMins(5);
      if(G.mode==='end') return;
      if(o.decoy){ G.wrongTurns++; G.decoy=o; G.bgKey=''; G.mode='decoy'; }
      else {
        G.loc=o.next; G.bgKey='';
        setTrack(G.loc>=2?'tense':'case_');
        setMsg(G.trail[G.loc].ambient);
        G.mode='scene';
      }
    },{sub:o.b});
  });
  BTN(12,166,296,18,'STAY PUT',()=>{ sfxClick(); G.mode='scene'; });
}
function drawDecoy(){
  const d=G.decoy;
  topBar(d.n);
  sceneFrame(d.scene);
  marquee();
  drawTextPanel();
  const lines=wrapText(d.txt,51);
  for(let i=0;i<lines.length&&i<5;i++) TXT(lines[i],8,113+i*9,'#d8dce8');
  TXT('This was a dead end.',8,113+Math.min(lines.length,5)*9,'#e07868');
  BTN(2,171,316,26,'HEAD BACK (5 MIN)',()=>{
    sfxTravel(); addMins(5);
    if(G.mode==='end') return;
    G.bgKey=''; setMsg(G.trail[G.loc].ambient); G.mode='scene';
  });
}
function dexMatches(){
  return PONIES.map((p,i)=>i).filter(i=>{
    const p=PONIES[i];
    for(const c of CATS){ const sel=G.dexPick[c.key]; if(sel!==null && p[c.key]!==sel) return false; }
    return true;
  });
}
function drawDex(){
  if(!G.dexPick) G.dexPick={mane:null,height:null,temper:null,feat:null};
  topBar('PONY-DEX 2000');
  R(0,12,W,188,'#0e1430');
  TXT('EQUINE SUSPECT DATABASE',6,16,'#68d8d8');
  R(6,25,110,1,'#2a3868');
  CATS.forEach((c,i)=>{
    const y=30+i*26, sel=G.dexPick[c.key];
    TXT(c.label,6,y,'#8a94b8');
    BTN(6,y+8,110,14,sel===null?'- ANY -':c.vals[sel],()=>{
      sfxClick();
      G.dexPick[c.key]=sel===null?0:(sel+1>=c.vals.length?null:sel+1);
      G.dexSel=-1;
    });
  });
  const m=dexMatches();
  TXT('MATCHES: '+m.length,6,138,m.length===1?'#68d868':'#d8dce8');
  if(G.warrant!==null){
    TXT('WARRANT ISSUED:',6,150,'#ffd858');
    TXT(PONIES[G.warrant].name,6,159,'#ff8858');
  } else {
    TXT('NO WARRANT ISSUED',6,150,'#5a6490');
  }
  BTN(6,172,110,20,'BACK',()=>{ sfxClick(); G.dexSel=-1; G.mode='scene'; });
  // suspect grid 4x2
  PONIES.forEach((p,i)=>{
    const gx=126+(i%4)*48, gy=26+((i/4)|0)*66;
    const active=m.includes(i);
    PANEL(gx,gy,46,62);
    drawPonyP(gx+3,gy+3,p);
    TXT(p.name,gx+23,gy+46,active?'#f0e8d0':'#5a6490','center');
    if(G.warrant===i){
      TXT('WARRANT',gx+23,gy+54,'#ff5848','center');
      R(gx,gy,46,1,'#ff5848'); R(gx,gy+61,46,1,'#ff5848'); R(gx,gy,1,62,'#ff5848'); R(gx+45,gy,1,62,'#ff5848');
    }
    if(!active){ DITH(gx+1,gy+1,44,60,'#0e1430',12); }
    else if(G.dexSel===i){ R(gx,gy,46,1,'#ffd858'); R(gx,gy+61,46,1,'#ffd858'); R(gx,gy,1,62,'#ffd858'); R(gx+45,gy,1,62,'#ffd858'); }
    if(active) hit(gx,gy,46,62,()=>{ sfxClick(); G.dexSel=(G.dexSel===i?-1:i); });
  });
  if(G.dexSel>=0){
    R(126,164,192,30,'#1c2444');
    R(126,164,192,1,'#4a5a90');
    TXT('ISSUE WARRANT FOR '+PONIES[G.dexSel].name+'?',222,168,'#ffd858','center');
    BTN(150,178,64,14,'ISSUE (1 MIN)',()=>{
      sfxStamp(); G.warrant=G.dexSel; G.dexSel=-1; addMins(1);
    });
    BTN(224,178,64,14,'HOLD ON',()=>{ sfxClick(); G.dexSel=-1; });
  } else if(m.length>1){
    TXT('Select traits to narrow the herd,',222,170,'#5a6490','center');
    TXT('then click a suspect.',222,179,'#5a6490','center');
  } else if(m.length===1 && G.warrant===null){
    TXT('One match. Click the suspect',222,170,'#68d868','center');
    TXT('to issue a warrant.',222,179,'#68d868','center');
  }
}
function drawNotes(){
  topBar('CASEBOOK');
  R(0,12,W,188,'#141228');
  // paper
  R(10,18,300,150,'#e8e4d0'); R(10,18,300,3,'#c8303080');
  for(let y=34;y<160;y+=9) R(16,y,288,1,'#c8c4b040');
  TXT('CASE NO. 251003 - THE M25 PONY',16,22,'#3a3020');

  const ty=45+Math.max(1,G.routeKnown.length)*9+4;
  TXT('THE SUSPECT:',16,ty,'#8a2430');
  CATS.forEach((c,i)=>{
    const v=G.traits[c.key];
    TXT(c.label+':',22,ty+9+i*9,'#3a3020');

  });
  const sy=ty+9+4*9+4;
  TXT('WARRANT: '+(G.warrant===null?'NONE':PONIES[G.warrant].name),16,sy,G.warrant===null?'#8a8470':'#8a2430');
  TXT('WRONG TURNS: '+G.wrongTurns+'   INTERVIEWS: '+G.interviews,16,sy+9,'#3a3020');
  TXT('ROAD CLOSED 06:50. CATCH IT BEFORE 08:00.',16,sy+18,'#8a2430');
  BTN(110,174,100,20,'BACK',()=>{ sfxClick(); G.mode='scene'; });
}
function tryCapture(){
  if(G.warrant===null){
    addMins(3);
    if(G.mode==='end') return;
    setMsg("PC HUGHES: 'Whoa, whoa. Warrant first. It has RIGHTS. This is not the Wild West - it is Buckinghamshire.' (+3 min)");
    sfxWrong();
    return;
  }
  addMins(4);
  if(G.mode==='end') return;
  const right=G.warrant===G.culprit;
  const wn=PONIES[G.warrant].name, cn=PONIES[G.culprit].name;
  G.pagePortrait=P_HUGHES; G.pageP=null; G.pageName='PC HUGHES'; G.pageJob='Officer at scene';
  if(right){
    G.caughtAt=G.mins;
    G.pages=startPages([
      {t:"You raise the warrant. PC Hughes nods the slow nod of a man who has waited his whole career for this exact paperwork."},
      {t:"Four officers and several members of the public advance in a respectful semicircle. The pony considers its options. It has none. It is, at last, gently apprehended."},
      {t:"It is - as your warrant correctly states - "+cn+". "+cn+" seems excited rather than distressed. Somewhere behind you, Paul Anthem is already composing."},
    ]);
    G.pageDone=()=>endGame('win');
  } else {
    G.pages=startPages([
      {t:"You raise the warrant. PC Hughes nods. The semicircle advances. The pony is apprehended, checked against the warrant..."},
      {t:"...and released with a formal apology. That is NOT "+wn+". "+wn+" has been in a field at Iver Heath all morning, with witnesses. Forty of them."},
      {t:"In the confusion, the actual culprit performs what one officer will later describe as 'a scarpering' and vanishes towards Junction 16, into legend."},
    ]);
    G.pageDone=()=>endGame('wrong');
  }
  G.page=0; G.mode='capture';
}
function drawCapture(){
  topBar('THE ARREST');
  sceneFrame('resv');
  livePony();
  marquee();
  drawPages();
  drawButtons(true);
}
function drawEnd(){
  if(G.endKind==='win') return drawWin();
  R(0,0,W,H,G.endKind==='wrong'?'#141228':'#200a0a');
  if(G.endKind==='gridlock'){
    ensureBG('carr'); fctx.drawImage(bg,SC_X,20);
    DITH(SC_X,20,SC_W,SC_H,'#600000',9);
    TXT('08:00. GRIDLOCK.',W/2,124,'#ff5848','center',2);
    const l=wrapText("The M25 is now, technically, a car park. The largest in Europe. Paul Anthem calls it 'a bold experiment in stillness'. The pony was last seen heading for the M40, at large and at ease.",48);
    l.forEach((t,i)=>TXT(t,W/2,144+i*9,'#d8b0a8','center'));
  } else {
    const p=PONIES[G.warrant];
    PANEL(120,24,80,80);
    drawPonyP(140,34,p);
    TXT(p.name,W/2,82,'#f0e8d0','center');
    TXT('RELEASED WITHOUT CHARGE',W/2,92,'#ff5848','center');
    TXT('CASE UNSOLVED',W/2,114,'#ff5848','center',2);
    const l=wrapText("The real culprit is still out there. Occasionally, on quiet mornings, junction cameras catch something small and hairy moving with great purpose. The file remains open.",48);
    l.forEach((t,i)=>TXT(t,W/2,134+i*9,'#b8b0d0','center'));
  }
  TXT('FINAL RANK: TRAFFIC CONE (HONORARY)',W/2,168,'#d8b048','center');
  BTN(100,180,120,16,'REOPEN THE CASE',()=>{ sfxClick(); newGame(); setTrack('case_'); });
}
function drawWin(){
  // Horse & Hound front page
  R(0,0,W,H,'#181420');
  R(8,4,304,190,'#ece8da');
  R(8,4,304,1,'#b8b4a0'); R(8,193,304,1,'#b8b4a0');
  TXT('HORSE & HOUND',W/2,10,'#1a1610','center',2);
  R(16,26,288,1,'#1a1610'); R(16,28,288,1,'#1a1610');
  TXT('SATURDAY 11 OCTOBER 2003',20,31,'#5a5648');
  TXT('ONE SHILLING (90p)',300,31,'#5a5648','right');
  R(16,40,288,1,'#8a8674');
  TXT('LOOSE SHETLAND CLOSES M25',W/2,46,'#1a1610','center',2);
  TXT("'EXCITED, NOT DISTRESSED'",W/2,62,'#8a2430','center');
  // photo
  PANEL(216,74,84,72);
  drawPonyP(238,80,PONIES[G.culprit]);
  TXT(PONIES[G.culprit].name,258,124,'#d8dce8','center');
  TXT('IN CUSTODY',258,133,'#d8dce8','center');
  TXT3('ESCORTED NOT LED',227,150,'#8a8470');
  // column filler
  for(let col=0;col<2;col++){
    const cx0=20+col*98;
    for(let i=0;i<9;i++) R(cx0,76+i*7,84-((rr(col*20+i)*30)|0),3,'#a8a494');
  }
  // stats box
  R(20,142,180,42,'#dcd8c6'); R(20,142,180,1,'#8a8674'); R(20,183,180,1,'#8a8674');
  TXT('CAUGHT: '+clockStr(G.caughtAt)+'   REOPENED: '+clockStr(Math.min(90,G.caughtAt+22)),24,146,'#3a3020');
  TXT('INTERVIEWS: '+G.interviews+'   WRONG TURNS: '+G.wrongTurns,24,155,'#3a3020');
  TXT('RANK EARNED:',24,164,'#3a3020');
  TXT(rankFor(G.caughtAt),24,173,'#8a2430');
  BTN(216,158,88,18,'NEW CASE',()=>{ sfxClick(); newGame(); setTrack('case_'); });
  if(G.caughtAt<=45) TXT('A RECORD!',258,178,'#8a2430','center');
  else TXT('The real police took 45 min.',258,180,'#8a8470','center');
}

// ============================================================
//  INPUT + MAIN LOOP
// ============================================================
function mapXY(e){
  const r=display.getBoundingClientRect();
  return { x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H };
}
display.addEventListener('pointermove',e=>{ const p=mapXY(e); G.mx=p.x; G.my=p.y; });
display.addEventListener('pointerdown',e=>{
  e.preventDefault();
  initAudio();
  const p=mapXY(e); G.mx=p.x; G.my=p.y;
  for(let i=HITS.length-1;i>=0;i--){
    const h=HITS[i];
    if(p.x>=h.x&&p.x<h.x+h.w&&p.y>=h.y&&p.y<h.y+h.h){ h.fn(); return; }
  }
});
newGame();
function frame(){
  tick++;
  HITS.length=0;
  R(0,0,W,H,'#000');
  switch(G.mode){
    case 'title':   drawTitle(); break;
    case 'brief':   drawBrief(); break;
    case 'scene':   drawScene(); break;
    case 'pick':    drawPick(); break;
    case 'talk':    drawTalk(); break;
    case 'travel':  drawTravel(); break;
    case 'decoy':   drawDecoy(); break;
    case 'dex':     drawDex(); break;
    case 'notes':   drawNotes(); break;
    case 'capture': drawCapture(); break;
    case 'end':     drawEnd(); break;
  }
  dctx.drawImage(buf,0,0,display.width,display.height);
  requestAnimationFrame(frame);
}
frame();
